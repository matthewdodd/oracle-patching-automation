---
# Inputs of initialization_role. Formats are checked by oracle_common (tasks/validate.yml), which the
# playbooks run before this role; the shared settings (working directories, script mode, group, patch
# repository, checksum, patch naming, staging layout) are documented in roles/oracle_common/meta/argument_specs.yml.
argument_specs:
  main:
    short_description: Prepare a database host for patching and resolve the patch bundle.
    description:
      - First validates the patch scope and chooses this run's working directories (oracle_common
        preflight_work_dirs.yml, sets oracle_common_run and oracle_common_script_env). With oracle_common_unique_work_dirs
        (alias oracle_patch_unique_work_dirs, default true) the script, output and staging directories carry
        "_<run id>", must not exist yet, and are recorded (initialization_role_created_paths) so the cleanup removes only
        what this run created; with false the original fixed names are removed and re-created as before.
      - Checks the prerequisite packages of the OS release (oracle_common packages.yml), verifies (exact process name)
        that sid_server_dict[<SID>].dbowner owns every running database in scope (DATABASE_NAME must be running), adds the
        database owner and the patch staging owner to oracle_common_group_name (when
        oracle_common_manage_group_membership is true), stages the patch scripts, detects the database version
        and resolves the patch bundle (oracle_common oracle_version_select.yml and patch_artifact.yml).
      - Passes ORA_ENV_FILE and ORA_WORK_DIR to database_version.bash, and adds the README patterns of the Oracle
        version to oracle_common_script_env (oracle_common preflight_script_env.yml).
      - Sets the facts the later roles use - ORACLE_SID, remote_script_directory, remote_output_directory,
        db_ver_long, db_ver, artf_ver, patch_file_prefix, patch_file_name, patch_folder_prefix, b_user and
        patch_folder_name.
      - Requires oracle_common to have run in the same play (import_role oracle_common).
    options:
      DATABASE_NAME:
        type: str
        required: true
        description: ORACLE_SID of the database to patch.
      sid_server_dict:
        type: dict
        required: true
        description: Inventory dictionary of databases keyed by ORACLE_SID (dbowner, pdb, dbvip, dbListener, pdbListener).
      target:
        type: str
        description: Target host list (shown in the database owner check message).
      oracle_common_patch_databases:
        type: raw
        description: >-
          Databases (ORACLE_SIDs) of the ORACLE_HOME patched together (alias oracle_patch_databases); default
          [DATABASE_NAME]. See roles/oracle_common/defaults/main/safety.yml.
      oracle_common_unique_work_dirs:
        type: raw
        description: Per-run working directories (alias oracle_patch_unique_work_dirs). Default true.
      oracle_common_run_id:
        type: raw
        description: Run id appended to the working directories (alias oracle_patch_run_id). Default generated.
