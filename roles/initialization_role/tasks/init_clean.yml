---
# Removes the script and output directories of an earlier run, as before, but only those used like the original fixed
# names (oracle_common_run.script_dir_fixed / output_fixed: oracle_common_unique_work_dirs false, or given explicitly).
# A generated per-run directory is never removed here.
- name: Remove {{ remote_script_directory }} if exists
  when: oracle_common_run.script_dir_fixed | default(true) | bool
  block:
    - name: Remove {{ remote_script_directory }} if exists - ansibleUser
      ansible.builtin.file:
        path: "{{ remote_script_directory }}"
        state: absent
  rescue:
    - name: Remove {{ remote_script_directory }} if exists - {{sid_server_dict[DATABASE_NAME].dbowner}}
      become: true
      become_user: "{{sid_server_dict[DATABASE_NAME].dbowner}}"
      ansible.builtin.file:
        path: "{{ remote_script_directory }}"
        state: absent

- name: Remove {{ remote_output_directory }} if exists
  when: oracle_common_run.output_fixed | default(true) | bool
  block:
    - name: Remove {{ remote_output_directory }} if exists - ansibleUser
      ansible.builtin.file:
        path: "{{ remote_output_directory }}"
        state: absent
  rescue:
    - name: Remove {{ remote_output_directory }} if exists - {{sid_server_dict[DATABASE_NAME].dbowner}}
      become: true
      become_user: "{{sid_server_dict[DATABASE_NAME].dbowner}}"
      ansible.builtin.file:
        path: "{{ remote_output_directory }}"
        state: absent
