---
# The working directories come from oracle_common (defaults/main/staging.yml; aliases remote_script_directory
# and remote_output_directory), which the playbook runs before this role.
- set_fact:
    ORACLE_SID: "{{ DATABASE_NAME }}"
    remote_script_directory: "{{ oracle_common_remote_script_directory }}"
    remote_output_directory: "{{ oracle_common_remote_output_directory }}"
    missing_packages: []

# Package list per OS release from the oracle_common OS variable files (RedHat-8/9/10.yml); package facts are
# gathered only where an rpm package manager is configured (not on AIX).
- name: Check whether pre-requisite packages are installed
  ansible.builtin.include_role:
    name: oracle_common
    tasks_from: packages

- name: Init Clean
  block:
    - name: Init Clean
      include_tasks: init_clean.yml
  ignore_errors: true

- name: Validate DB Owner
  block:
    - name: Get the DB owner id
      shell: |
        ps -ef | grep -v grep | grep ora_pmon_{{ ORACLE_SID }} | awk '{print $1}'
      register: shell_output

    - name: Validate the DB owner id
      debug:
        msg: "Found DB Owner on {{ target }} is: {{ shell_output.stdout }} / Inventory lists DB Owner as: {{ sid_server_dict[ORACLE_SID].dbowner }}"
      failed_when: shell_output.stdout != sid_server_dict[ORACLE_SID].dbowner

- name: Add member to group
  when: oracle_common_manage_group_membership | bool
  block:
    - name: Add member to group
      include_tasks: group_membership.yml
      loop:
        - "{{sid_server_dict[DATABASE_NAME].dbowner}}"

- name: Run init
  become: true
  become_user: "{{sid_server_dict[DATABASE_NAME].dbowner}}"
  block:
    - name: Create {{ remote_script_directory }}
      ansible.builtin.file:
        path: "{{ remote_script_directory }}"
        state: directory
        mode: "{{ oracle_common_modes.script }}"

    - name: Create roles/oracle_database_patch_role/files if not exist
      copy:
        # role_path-based so the source does not depend on the playbook directory.
        src: "{{ role_path }}/../oracle_database_patch_role/files/"
        dest: "{{ remote_script_directory }}/oracle_database_patch_role"
        mode: "{{ oracle_common_modes.script }}"

    - name: Create {{ remote_output_directory }}
      ansible.builtin.file:
        path: "{{ remote_output_directory }}"
        state: directory
        mode: "{{ oracle_common_modes.script }}"

    - name: Get database version
      shell: |
        {{ remote_script_directory }}/oracle_database_patch_role/database_version.bash {{ ORACLE_SID }}
      register: shell_output
      failed_when: shell_output.rc != 0

    - name: Ingest database version information
      ansible.builtin.slurp:
        src: "{{ remote_output_directory }}/db_version.txt"
      register: db_ver_slurp

    - set_fact:
        db_ver_long: "{{ db_ver_slurp['content']|b64decode|trim }}"

    # Selects the vars/oracle_versions/<version>.yml entry of oracle_common for the detected version (12.1,
    # 12.2, 19, 23ai, 26ai); an unknown version stops here instead of falling back to the 12.1 artifacts.
    - name: Select the Oracle version
      ansible.builtin.include_role:
        name: oracle_common
        tasks_from: oracle_version_select
      vars:
        oracle_common_detected_version: "{{ db_ver_long }}"

    - set_fact:
        db_ver: "{{ db_ver_long[:4] }}"

    - set_fact:
        artf_ver: "{{ oracle_common_oracle_version.artifact_dir }}"

    # Resolves the patch file name (<AIX|LINUX>_<cycle><year>.tar.gz by default, the original
    # <AIX|LINUX>_jan<YY>.tar.gz), the repository URL (oracle_common_patch_repo_url, alias artifactory_repo; required),
    # the staging directory and its owner, and compares the repository release folder with the detected version
    # (replaces the original fixed-offset "Check for Sanity").
    - name: Resolve the patch bundle and check for sanity
      ansible.builtin.include_role:
        name: oracle_common
        tasks_from: patch_artifact

    - set_fact:
        patch_file_prefix: "{{ oracle_common_artifact_platform }}"

    - set_fact:
        patch_file_name: "{{ oracle_common_patch.file_name }}"

    - debug:
        msg: "The patch_file_name is: {{ patch_file_name }}"

    - set_fact:
        patch_folder_prefix: "{{ oracle_common_patch.base_dir }}"
        b_user: "{{ oracle_common_patch.owner }}"

    - set_fact:
        patch_folder_name: "{{ oracle_common_patch.staging_dir }}"

- name: Add member to group
  when: oracle_common_manage_group_membership | bool
  block:
    - name: Add member to group
      include_tasks: group_membership.yml
      loop:
        - "{{ b_user }}"
