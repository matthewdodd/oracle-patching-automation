---
# Prepares a target for patching. Requires oracle_common to have run in the same play (import_role oracle_common).
#   1. Validate the patch scope and choose this run's working directories (oracle_common preflight_work_dirs.yml:
#      oracle_common_run, oracle_common_script_env). With oracle_common_unique_work_dirs (default true) every run has
#      its own script, output and staging directories, so it never touches another run's or another database's files.
#   2. Package check, database owner check (every running database in scope), group membership (become, no raw sudo).
#   3. Create the working directories (refusing a generated per-run directory that already exists, recording each so
#      the cleanup removes only what this run created; fixed or explicitly given directories are removed and
#      re-created, as before), stage the scripts, detect the database version and resolve the patch bundle.
- name: Validate the patch scope and choose this run's working directories
  ansible.builtin.include_role:
    name: oracle_common
    tasks_from: preflight_work_dirs

# Original fact names, read by oracle_database_patch_role, standalone_control_role and the playbooks.
- name: Set the database and working directory facts
  ansible.builtin.set_fact:  # noqa: var-naming[no-role-prefix] var-naming[pattern] - original fact names, kept for compatibility
    ORACLE_SID: "{{ DATABASE_NAME }}"
    remote_script_directory: "{{ oracle_common_run.script_dir }}"
    remote_output_directory: "{{ oracle_common_run.databases[DATABASE_NAME].work_dir }}"
    missing_packages: []
    initialization_role_created_paths: []

# Package list per OS release from the oracle_common OS variable files (RedHat-8/9/10.yml); package facts are
# gathered only where an rpm package manager is configured (not on AIX).
- name: Check whether pre-requisite packages are installed
  ansible.builtin.include_role:
    name: oracle_common
    tasks_from: packages

# Only for directories used like the original fixed names (oracle_common_unique_work_dirs false, or a directory given
# explicitly: remote_script_directory, remote_output_directory): remove the directories of an earlier run, as before.
# Generated per-run directories are new by construction, and one that already exists is refused below.
- name: Remove the working directories of an earlier run (fixed or explicitly given directories only)
  when: (oracle_common_run.script_dir_fixed | bool) or (oracle_common_run.output_fixed | bool)
  block:
    - name: Init Clean
      ansible.builtin.include_tasks: init_clean.yml
  rescue:
    - name: Report the working directories that could not be removed
      ansible.builtin.debug:
        msg: >-
          WARNING: could not remove the working directories of an earlier run
          ({{ ansible_failed_result.msg | default('no message') }}); they are re-used if this run can write to them.

- name: Validate the owner of every running database in scope
  ansible.builtin.include_tasks: db_owner.yml
  loop: "{{ oracle_common_run.scope }}"
  loop_control:
    loop_var: __initialization_role_sid

# The database owner and the patch staging owner (oracle_common_patch_owner, the original b_user) join
# oracle_common_group_name, once each (the original included this task file twice and, when both were the same user,
# ran it twice for that user). Before the working and staging directories are created, so a shared
# oracle_common_work_group can already be applied to them.
- name: Add member to group
  when: oracle_common_manage_group_membership | bool
  block:
    - name: Add member to group
      ansible.builtin.include_tasks: group_membership.yml
      loop: "{{ [sid_server_dict[DATABASE_NAME].dbowner, oracle_common_patch_owner] | unique }}"
      loop_control:
        loop_var: __initialization_role_member

- name: Run init
  become: true
  become_user: "{{ sid_server_dict[DATABASE_NAME].dbowner }}"
  block:
    - name: Create the script directory of this run
      ansible.builtin.include_tasks: run_dir.yml
      vars:
        __initialization_role_dir: "{{ remote_script_directory }}"
        __initialization_role_dir_owner: "{{ sid_server_dict[DATABASE_NAME].dbowner }}"
        __initialization_role_dir_remove: true
        __initialization_role_dir_fixed: "{{ oracle_common_run.script_dir_fixed | bool }}"

    - name: Create roles/oracle_database_patch_role/files if not exist
      ansible.builtin.copy:
        # role_path-based so the source does not depend on the playbook directory.
        src: "{{ role_path }}/../oracle_database_patch_role/files/"
        dest: "{{ remote_script_directory }}/oracle_database_patch_role"
        mode: "{{ oracle_common_modes.script }}"
        directory_mode: "{{ oracle_common_modes.dir }}"
        group: "{{ oracle_common_work_group if (oracle_common_work_group | default('') | length > 0) else omit }}"

    # The working directory of DATABASE_NAME first (the others are inside it). Logs and script output are kept after
    # the run, as before.
    - name: Create the working directory of each database in scope
      ansible.builtin.include_tasks: run_dir.yml
      vars:
        __initialization_role_dir: "{{ oracle_common_run.databases[__initialization_role_sid].work_dir }}"
        __initialization_role_dir_owner: "{{ sid_server_dict[DATABASE_NAME].dbowner }}"
        __initialization_role_dir_remove: false
        __initialization_role_dir_fixed: "{{ oracle_common_run.output_fixed | bool }}"
      loop: "{{ oracle_common_run.scope }}"
      loop_control:
        loop_var: __initialization_role_sid

    - name: Get database version
      ansible.builtin.command:
        argv:
          - "{{ remote_script_directory }}/oracle_database_patch_role/database_version.bash"
          - "{{ ORACLE_SID }}"
      environment: "{{ oracle_common_script_env[DATABASE_NAME] }}"
      register: __initialization_role_db_version
      changed_when: false

    - name: Ingest database version information
      ansible.builtin.slurp:
        src: "{{ remote_output_directory }}/db_version.txt"
      register: __initialization_role_db_version_file

    - name: Set the detected database version
      ansible.builtin.set_fact:  # noqa: var-naming[no-role-prefix] - original fact name, kept for compatibility
        db_ver_long: "{{ __initialization_role_db_version_file['content'] | b64decode | trim }}"

    # Selects the vars/oracle_versions/<version>.yml entry of oracle_common for the detected version (12.1,
    # 12.2, 19, 23ai, 26ai); an unknown version stops here instead of falling back to the 12.1 artifacts.
    - name: Select the Oracle version
      ansible.builtin.include_role:
        name: oracle_common
        tasks_from: oracle_version_select
      vars:
        oracle_common_detected_version: "{{ db_ver_long }}"

    - name: Set the database version facts
      ansible.builtin.set_fact:  # noqa: var-naming[no-role-prefix] - original fact names, kept for compatibility
        db_ver: "{{ db_ver_long[:4] }}"
        artf_ver: "{{ oracle_common_oracle_version.artifact_dir }}"

    # Resolves the patch file name (<AIX|LINUX>_<cycle><year>.tar.gz by default, the original
    # <AIX|LINUX>_jan<YY>.tar.gz), the repository URL (oracle_common_patch_repo_url, alias artifactory_repo; required),
    # the staging directory and its owner, and compares the repository release folder with the detected version
    # (replaces the original fixed-offset "Check for Sanity").
    - name: Resolve the patch bundle and check for sanity
      ansible.builtin.include_role:
        name: oracle_common
        tasks_from: patch_artifact

    # The staging directory carries "_<run id>" with per-run directories (unless patch_folder_name or
    # oracle_common_patch_staging_dir was given explicitly).
    - name: Set the patch bundle facts
      ansible.builtin.set_fact:  # noqa: var-naming[no-role-prefix] - original fact names, kept for compatibility
        patch_file_prefix: "{{ oracle_common_artifact_platform }}"
        patch_file_name: "{{ oracle_common_patch.file_name }}"
        patch_folder_prefix: "{{ oracle_common_patch.base_dir }}"
        b_user: "{{ oracle_common_patch.owner }}"
        patch_folder_name: "{{ __oracle_common_run_staging_dir }}"

    - name: Validate the staging directory of this run
      ansible.builtin.assert:
        that:
          - patch_folder_name is match(__oracle_common_re_abs_path)
          - patch_folder_name is not search(__oracle_common_re_dotdot)
        fail_msg: "Invalid patch staging directory for this run: {{ patch_folder_name }}"
        success_msg: "The patch_file_name is: {{ patch_file_name }}; staged in {{ patch_folder_name }} by {{ b_user }}"

    - name: Add the Oracle version settings to the script environment
      ansible.builtin.include_role:
        name: oracle_common
        tasks_from: preflight_script_env
