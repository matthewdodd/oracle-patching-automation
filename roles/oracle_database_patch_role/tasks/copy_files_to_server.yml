---
- name: Copy files to server
  become: true
  become_user: "{{ b_user }}"
  block:
    - set_fact:
        download_dir: "{{ temp_dir }}"

    - name: Remove prior {{ temp_dir }}
      file:
        state: absent
        path: "{{ temp_dir }}/"

    - name: Create {{ temp_dir }}
      ansible.builtin.file:
        path: "{{ temp_dir }}"
        state: directory
        mode: "{{ oracle_common_modes.script }}"

    # The repository folder (oracle_common_patch_repo_url, alias artifactory_repo, plus the release folder) is
    # resolved and checked by oracle_common (tasks/patch_artifact.yml); it is not shown in the task name because
    # it may carry credentials.
    - name: Download {{ artf_file_name }} to {{ download_dir }}
      ansible.builtin.get_url:
        url: '{{ oracle_common_patch.repo_dir_url }}/{{ artf_file_name }}'
        dest: '{{ download_dir }}/{{ artf_file_name }}'
        validate_certs: false
        force_basic_auth: true
        mode: "{{ oracle_common_modes.script }}"
        tmp_dest: "{{ temp_dir }}"
        use_proxy: false

    - name: Extract {{ artf_file_name }} into {{ temp_dir }}
      ansible.builtin.unarchive:
        remote_src: true
        src: "{{ download_dir }}/{{ artf_file_name }}"
        dest: "{{ temp_dir }}"

    - name: Remove {{ download_dir }}/{{ artf_file_name }}
      file:
        state: absent
        path: "{{ item }}"
      loop:
        - "{{ download_dir }}/{{ artf_file_name }}"
      ignore_errors: true

    - name: Find all files in "{{ temp_dir }}"
      find:
        paths: "{{ temp_dir }}"
        patterns: '*.zip,*.tar.gz'
      register: output

    - name: Extract all files into {{ temp_dir }}
      ansible.builtin.unarchive:
        remote_src: true
        src: "{{ item.path }}"
        dest: "{{ temp_dir }}"
      with_items: "{{ output.files }}"

    - name: Change Permissions of all files in {{ temp_dir }}
      file:
        path: "{{ temp_dir }}"
        state: directory
        recurse: true
        mode: "{{ oracle_common_modes.script }}"
