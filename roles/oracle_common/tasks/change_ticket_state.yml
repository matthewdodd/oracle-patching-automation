---
# Checks the change record returned by servicenow.itsm.change_request_info (__oracle_common_chg_result.records):
# exactly one record, and its state within oracle_common_snow_allowed_state_min .. _max (ServiceNow numeric
# states; servicenow.itsm returns state names, mapped back with oracle_common_snow_change_states). Prints only the
# number and the state, never the record. No network: tests feed a result to this file directly.
- name: Read the change record state
  ansible.builtin.set_fact:
    __oracle_common_chg_count: "{{ __oracle_common_chg_records | length }}"
    __oracle_common_chg_state_raw: "{{ __oracle_common_chg_raw }}"
    __oracle_common_chg_state: >-
      {{ (__oracle_common_chg_raw | int) if __oracle_common_chg_raw is match('\A-?[0-9]+\Z')
         else (oracle_common_snow_change_states[__oracle_common_chg_raw | lower] | string)
         if (__oracle_common_chg_raw | lower) in oracle_common_snow_change_states else '' }}
  vars:
    __oracle_common_chg_records: "{{ __oracle_common_chg_result.records | default([]) }}"
    __oracle_common_chg_raw: >-
      {{ (__oracle_common_chg_records[0].state | default('') | string | trim) if __oracle_common_chg_records | length == 1 else '' }}

- name: Check that the change record exists
  ansible.builtin.assert:
    that: __oracle_common_chg_count | int == 1
    fail_msg: >-
      change record {{ TICKET_NUMBER }} {{ 'was not found in ServiceNow' if __oracle_common_chg_count | int == 0
      else 'matched ' ~ __oracle_common_chg_count ~ ' records in ServiceNow (expected exactly one)' }}
    quiet: true

- name: Show the possible change ticket states
  ansible.builtin.debug:
    msg:
      - "Possible Change Ticket States:"
      - "State     | Value"
      - "----------|------"
      - "New       | -5"
      - "Assess    | -4"
      - "Authorize | -3"
      - "Scheduled | -2"
      - "Implement | -1"
      - "Review    |  0"
      - "Closed    |  3"
      - "Cancelled |  4"

- name: Show the change record state
  ansible.builtin.debug:
    msg: "Change record {{ TICKET_NUMBER }} state is {{ __oracle_common_chg_state_raw }} ({{ __oracle_common_chg_state }})"

- name: Assert that the change record is in the right state
  ansible.builtin.assert:
    that:
      - __oracle_common_chg_state | string is match('\A-?[0-9]+\Z')
      - __oracle_common_chg_state | int >= oracle_common_snow_allowed_state_min | int
      - __oracle_common_chg_state | int <= oracle_common_snow_allowed_state_max | int
    fail_msg: >-
      change record {{ TICKET_NUMBER }} is not in the required state (state '{{ __oracle_common_chg_state_raw }}';
      allowed {{ oracle_common_snow_allowed_state_min }} .. {{ oracle_common_snow_allowed_state_max }},
      default Scheduled (-2) .. Implement (-1); an unknown state name can be added to oracle_common_snow_change_states)
    quiet: true
