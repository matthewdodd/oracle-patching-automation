---
# Oracle Database 12c Release 1 (12.1.0.2). One entry of the supported-version registry built by tasks/oracle_version.yml, keyed by this file's
# name (12.1). Adding an Oracle version means adding one such file. Any value can be overridden per environment
# without editing this file: oracle_common_oracle_version_overrides: {"12.1": {<key>: <value>}}.
# All values sit under one key so the file is also safe to load with include_vars.
__oracle_common_version_definition:
  label: Oracle Database 12c Release 1 (12.1.0.2)
  # Detected version (v$instance.version, e.g. 12.1.0.2.0) that selects this entry automatically.
  match_regex: '\A12\.1(?:\.[0-9]+)*\Z'
  # Detected versions accepted when this entry is selected explicitly (oracle_common_db_version).
  accept_regex: '\A12\.1(?:\.[0-9]+)*\Z'
  # Folder of this release in the patch repository (the original artf_ver).
  artifact_dir: "12.1.0.2"
  # Version component of the patch staging directory (the original db_ver, the first 4 characters of the version).
  staging_component: "12.1"
  # README.html patterns (grep basic regular expressions) that identify the Release Update folder and the OJVM
  # folder of the patch bundle, and how many README lines must match the OJVM pattern (the original: more than 1).
  readme_ru_pattern: 'Database * Release Update'
  readme_jvm_pattern: '\- Oracle JavaVM Component'
  readme_jvm_min_matches: 2
  # AIX only: rewrite $ORACLE_HOME/QOpatch/qopiprep.bat to use ksh93 (database_patch.bash qopiprep mode).
  qopiprep_fix: true
  # How datapatch runs: upgrade (startup upgrade + open PDBs in upgrade mode; the original, for every version)
  # or normal (database open normally).
  datapatch_startup_mode: upgrade
  # Out of Oracle Premier and Extended Support: a warning is shown, the patch still runs.
  desupported: true
