---
# IBM AIX (ansible_facts['system'] == 'AIX').
__oracle_common_artifact_platform: AIX
# package_facts has no AIX package manager and rpm (AIX Toolbox) does not list the base OS filesets, so the
# rpm package_facts call is never made on AIX. Installed filesets can be listed read-only with `lslpp -Lc`;
# the regex captures the Fileset field of each "Package Name:Fileset:Level:..." line.
__oracle_common_package_manager: ""
__oracle_common_package_query_command: [/usr/bin/lslpp, -Lc]
__oracle_common_package_query_regex: '(?m)^[^#:\s][^:]*:([^:]+):'
# Empty by default: the fileset check is skipped with an explicit message (the original playbook never
# checked AIX). To enable it, set oracle_common_prereq_packages to the filesets your release requires, e.g.
# the Oracle Database 19c list for AIX 7.2 / 7.3 (Oracle Database Installation Guide for IBM AIX on POWER
# Systems, "Operating System Requirements"):
#   bos.adt.base, bos.adt.lib, bos.adt.libm, bos.perf.libperfstat, bos.perf.perfstat, bos.perf.proctools,
#   rsct.basic.rte, rsct.compat.clients.rte, xlC.aix61.rte, xlC.rte
__oracle_common_prereq_packages: []
