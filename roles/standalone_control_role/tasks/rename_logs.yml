---
## This script renames existing alert log and listener logs so that new logs will be created. Logged as before
## (<remote_output_directory>/log.<rename_logs_script>.<YYYY.MM.DD>); no shell interpolation.

- name: copy rename_logs script to {{ server_name }}  # noqa: name[casing] - original task name
  # Short module name kept: tests/script_copy_become.yml looks the task up by the key 'copy'.
  copy:  # noqa: fqcn[action-core]
    src: "{{ rename_logs_script }}"
    dest: "{{ remote_script_directory }}/{{ rename_logs_script }}"
    mode: "{{ oracle_common_modes.script }}"
    force: true
  delegate_to: "{{ server_name }}"
  # Written as the database owner: remote_script_directory belongs to that user and is no longer
  # world-writable (0777 removed), so the SSH user cannot write into it.
  become: true
  become_user: "{{ sid_server_dict[standalone_control_role_sid_key].dbowner }}"

# The listener names (dbListener, pdbListener) follow ORACLE_SID as before; an empty one is left out, as the original
# shell's word splitting did.
- name: Rename alert log for {{ ORACLE_SID }}
  ansible.builtin.command:
    argv: >-
      {{ [oracle_common_bash_path | default('/usr/bin/bash'), '-c', __standalone_control_role_logged_run, 'rename_logs',
          remote_output_directory ~ '/log.' ~ rename_logs_script,
          remote_script_directory ~ '/' ~ rename_logs_script, ORACLE_SID]
         + (sid_server_dict[standalone_control_role_sid_key].dbListener | string).split()
         + (sid_server_dict[standalone_control_role_sid_key].pdbListener | string).split() }}
    expand_argument_vars: false
  delegate_to: "{{ server_name }}"
  # ORA_ENV_FILE of this database in a patch run (oracle_control_sid.yml); empty: the script default, as before.
  environment: "{{ standalone_control_role_environment }}"
  register: rename_logs_status  # noqa: var-naming[no-role-prefix] - original register name
  changed_when: true
  become: true
  become_user: "{{ sid_server_dict[standalone_control_role_sid_key].dbowner }}"
  failed_when: rename_logs_status.rc != 4 and rename_logs_status.rc != 0

- name: print rename_logs_script status for {{ ORACLE_SID }}  # noqa: name[casing] - original task name
  ansible.builtin.debug:
    msg: "{{ rename_logs_status.stdout_lines }}"
  failed_when: rename_logs_status.rc == 4
