---
## This script copies the check_alert_log.bash script to server and checks the alert log for errors and warnings.
## Logged as before (to <remote_output_directory>/log.<check_mount_script>.<YYYY.MM.DD>, the original log name); no
## shell interpolation.

- name: copy check_alert_log script to {{ server_name }}  # noqa: name[casing] - original task name
  # Short module name kept: tests/script_copy_become.yml looks the task up by the key 'copy'.
  copy:  # noqa: fqcn[action-core]
    src: "{{ check_alertLog_script }}"
    dest: "{{ remote_script_directory }}/{{ check_alertLog_script }}"
    mode: "{{ oracle_common_modes.script }}"
    force: true
  delegate_to: "{{ server_name }}"
  # Written as the database owner: remote_script_directory belongs to that user and is no longer
  # world-writable (0777 removed), so the SSH user cannot write into it.
  become: true
  become_user: "{{ sid_server_dict[standalone_control_role_sid_key].dbowner }}"


- name: Checking alert log for errors for {{ ORACLE_SID }}
  ansible.builtin.command:
    argv:
      - "{{ oracle_common_bash_path | default('/usr/bin/bash') }}"
      - -c
      - "{{ __standalone_control_role_logged_run }}"
      - check_alert_log
      - "{{ remote_output_directory }}/log.{{ check_mount_script }}"
      - "{{ remote_script_directory }}/{{ check_alertLog_script }}"
      - "{{ ORACLE_SID }}"
    expand_argument_vars: false
  delegate_to: "{{ server_name }}"
  # ORA_ENV_FILE of this database in a patch run (oracle_control_sid.yml); empty: the script default, as before.
  environment: "{{ standalone_control_role_environment }}"
  register: check_alertLog_status  # noqa: var-naming[pattern] - original register name
  changed_when: false
  become: true
  become_user: "{{ sid_server_dict[standalone_control_role_sid_key].dbowner }}"

- name: print check_alertLog_status for {{ ORACLE_SID }}  # noqa: name[casing] - original task name
  ansible.builtin.debug:
    msg: "{{ check_alertLog_status.stdout_lines }}"
  failed_when: "'ORA-' in check_alertLog_status.stdout"
  ignore_errors: true
