---
# Copies the control scripts of this role into remote_script_directory, once, before any startup or shutdown step.
# The original copied each script in the step that used it, so the startup relied on database_ctl.bash and
# listener_ctl.bash having been copied by an earlier shutdown in the same run: a startup on its own (a re-run after a
# failure, or after a manual shutdown) failed. Every script either action can call is copied (the configured names,
# once each); a script whose content is unchanged is left alone (idempotent).
- name: Copy the control scripts to {{ server_name }}
  ansible.builtin.copy:
    src: "{{ __standalone_control_role_script }}"
    dest: "{{ remote_script_directory }}/{{ __standalone_control_role_script }}"
    mode: "{{ oracle_common_modes.script }}"
    force: true
  loop: "{{ __standalone_control_role_scripts | unique | list }}"
  loop_control:
    loop_var: __standalone_control_role_script
  delegate_to: "{{ server_name }}"
  # Written as the database owner: remote_script_directory belongs to that user and is no longer
  # world-writable (0777 removed), so the SSH user cannot write into it.
  become: true
  become_user: "{{ sid_server_dict[standalone_control_role_sid_key].dbowner }}"
  vars:
    __standalone_control_role_scripts:
      - "{{ standalone_control_role_rename_logs_script }}"
      - "{{ standalone_control_role_start_database_script }}"
      - "{{ standalone_control_role_check_alert_log_script }}"
      - "{{ standalone_control_role_start_listener_script }}"
      - "{{ standalone_control_role_check_listener_logs_script }}"
      - "{{ standalone_control_role_stop_pdb_listener_script }}"
      - "{{ standalone_control_role_stop_listener_script }}"
      - "{{ standalone_control_role_stop_database_script }}"
