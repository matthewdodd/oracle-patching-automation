---
## This script stops the listener. The output is logged to <remote_output_directory>/log.<script>.<YYYY.MM.DD>, as
## before, but the script's own exit code is kept (it was hidden by the pipe into tee): 0 = stopped, 4 = already
## stopped (accepted), anything else = the listener could not be stopped (fails, so the home is not patched while its
## listener runs).

- name: Stop the database listener {{ sid_server_dict[standalone_control_role_sid_key].dbListener ~ ' of ' ~ ORACLE_SID ~ ' on ' ~ server_name }}
  ansible.builtin.command:
    argv:
      - "{{ oracle_common_bash_path | default('/usr/bin/bash') }}"
      - -c
      # Static script; the values are passed as positional parameters, never interpolated into it.
      - set -o pipefail; "$1" stop "$2" "$3" 2>&1 | tee "$4.$(date +%Y.%m.%d)"
      - stop_listener
      - "{{ remote_script_directory }}/{{ standalone_control_role_stop_listener_script }}"
      - "{{ ORACLE_SID }}"
      - "{{ sid_server_dict[standalone_control_role_sid_key].dbListener }}"
      - "{{ remote_output_directory }}/log.{{ standalone_control_role_stop_listener_script }}"
    expand_argument_vars: false
  delegate_to: "{{ server_name }}"
  # ORA_ENV_FILE of this database in a patch run (oracle_control_sid.yml); empty: the script default, as before.
  environment: "{{ standalone_control_role_environment }}"
  register: standalone_control_role_listener_stop_status
  changed_when: standalone_control_role_listener_stop_status.rc == 0
  failed_when: standalone_control_role_listener_stop_status.rc not in [0, 4]
  become: true
  become_user: "{{ sid_server_dict[standalone_control_role_sid_key].dbowner }}"

- name: Print listener_stop_status for {{ ORACLE_SID }}
  ansible.builtin.debug:
    msg: "{{ standalone_control_role_listener_stop_status.stdout_lines }}"
