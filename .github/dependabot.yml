---
# Keeps the commit-SHA pins of the GitHub Actions in .github/workflows/ up to date (Dependabot updates the SHA and the
# trailing "# vX.Y.Z" version comment together), and the exact pins of the Python tooling in requirements.txt and
# requirements-test.txt (ansible-core, ansible-lint, yamllint, shellcheck-py, Molecule). Each update is a pull request
# that must pass the lint and molecule checks before it is merged.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    open-pull-requests-limit: 5
