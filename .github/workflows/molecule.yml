---
name: Molecule

# End-to-end tests of the patch playbook in RHEL-compatible containers with stub Oracle software (molecule/, plan finding
# U6-01), one job per scenario:
#   default      AlmaLinux 9, one database (canonical input names), re-run already applied, wrong checksum refused
#   el8          Rocky Linux 8, one upper-case SID without Java (original input names / aliases)
#   shared-home  AlmaLinux 9, two databases on one ORACLE_HOME: refused with one in scope, patched with both
# Runs on every pull request, with no paths filter, so a required check reports on every PR, docs-only ones included
# (a required check that never runs blocks the PR forever). Also runs on push to master, so master's own status is
# visible after each merge, and on demand.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: molecule-${{ github.ref }}
  cancel-in-progress: true

jobs:
  molecule:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # Every scenario reports, even when another one fails.
      fail-fast: false
      matrix:
        scenario: [default, el8, shared-home]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install test tooling
        run: pip install -r requirements-test.txt

      - name: shellcheck the test fixture
        run: shellcheck molecule/shared/files/*.bash molecule/shared/files/stubs/*

      - name: molecule test
        # The scenario name reaches the shell through the environment, never interpolated into the script.
        run: molecule test --scenario-name "$SCENARIO"
        env:
          SCENARIO: ${{ matrix.scenario }}
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
