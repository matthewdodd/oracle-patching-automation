---
# Regression test for the standalone_control_role start, rename and check tasks after U3 replaced their shell commands
# (`<script> <args> &> >(tee <log>.$(date +%Y.%m.%d))`) with an argument vector: a static bash script that gets the log
# prefix, the script and its arguments as positional parameters. Runs on the controller only, inside a temporary
# directory, with stub scripts where the task does not copy the real one first; become is turned off for the play
# (ansible_become: false overrides the task keyword). Run from the repository root:
#   ansible-playbook -i localhost, -c local tests/standalone_commands.yml
#
# 1. start_database.yml: the script gets "start <SID>"; exit 0 passes, 4 fails the report task (as before), 1 fails.
# 2. start_listener.yml: the script gets "start <SID> <listener>", the output is in the task result and in
#    <remote_output_directory>/log.<start_listener_script>.<YYYY.MM.DD>, the exit code is the script's own; a listener
#    value with shell metacharacters is split on whitespace only (the original word splitting) and runs nothing.
# 3. copy_scripts.yml copies every control script once (the configured names, the database owner's script mode);
#    rename_logs.yml and start_pdb_listener.yml run the real scripts: an empty pdbListener is left out (the original
#    word splitting), the log file names are the original ones, and the scripts' exit code 4 (here: missing environment
#    file) is accepted by the command. The PDB listener reports it as a failure, as before; the log rotation reports a
#    WARNING by default (the database is still started) and fails with standalone_control_role_fail_on_rename_logs_error.
# 4. check_alert_log.yml and check_listener_logs.yml with the real scripts (missing environment file): a WARNING by
#    default, as before (no ignore_errors), and a failure with the standalone_control_role_fail_on_*_log_errors toggles.
#    The alert log check writes log.<check_alertLog_script> (standalone_control_role_alert_log_check_log).
# 5. tasks/main.yml: an empty or missing dbvip skips the VIP ping; the scripts are copied before either action; each
#    database records its state (oracle_common_progress: stopping before the stop and stopped after it, starting before
#    the start and started after it) for the failure report.
- name: Standalone control commands regression test
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../roles/standalone_control_role/defaults/main.yml
    - ../roles/standalone_control_role/vars/main.yml
  vars:
    ansible_become: false
    server_name: localhost
    ORACLE_SID: orcl  # noqa: var-naming[pattern] - original fact name used by the role
    oracle_common_bash_path: /bin/bash
    oracle_common_modes: {script: "0750", dir: "0750", file: "0640"}
  tasks:
    - name: Run the standalone command cases
      block:
        - name: Create a temporary directory
          ansible.builtin.tempfile:
            state: directory
            prefix: standalone_commands.
          register: sc_tmp

        - name: Read the current user
          ansible.builtin.command:
            argv: [id, -un]
          register: sc_user
          changed_when: false

        - name: Set the working directories and the database entry
          ansible.builtin.set_fact:
            remote_script_directory: "{{ sc_tmp.path }}/scripts"
            remote_output_directory: "{{ sc_tmp.path }}/output"
            standalone_control_role_sid_key: orcl
            sid_server_dict:
              orcl: {dbowner: "{{ sc_user.stdout }}", pdb: "", dbvip: "", dbListener: LISTENER_ORCL, pdbListener: ""}
            standalone_control_role_environment:
              ORA_ENV_FILE: "{{ sc_tmp.path }}/missing/orcl.env"
            sc_today: "{{ now(fmt='%Y.%m.%d') }}"
            start_database_script: stub_database_ctl.bash

        - name: Create the working directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0700"
          loop: ["{{ remote_script_directory }}", "{{ remote_output_directory }}"]

        # Stub: records its arguments (one per line) in <name>.args, prints a line and exits with $SC_RC (default 0).
        - name: Create the stub scripts
          ansible.builtin.copy:
            dest: "{{ remote_script_directory }}/{{ item }}"
            mode: "0700"
            content: |
              #!/bin/sh
              printf '%s\n' "$@" > "$0.args"
              echo "stub $(basename "$0") ran"
              echo "stub stderr line" >&2
              exit "${SC_RC:-0}"
          loop: [stub_database_ctl.bash, listener_ctl.bash]

        # --- 1. start_database.yml ----------------------------------------------------------------------------
        - name: Start the database (exit 0)
          ansible.builtin.include_role:
            name: standalone_control_role
            tasks_from: start_database

        - name: Read the arguments of the database script (case 1)
          ansible.builtin.slurp:
            src: "{{ remote_script_directory }}/stub_database_ctl.bash.args"
          register: sc_db_args

        - name: Check the database script got "start <SID>" (case 1)
          ansible.builtin.assert:
            that:
              - (sc_db_args.content | b64decode).splitlines() == ['start', 'orcl']
              - standalone_control_role_db_start_status.rc == 0
              - "'stub stub_database_ctl.bash ran' in standalone_control_role_db_start_status.stdout"

        - name: Start the database with exit code 4
          block:
            - name: Start the database (exit 4)
              ansible.builtin.include_role:
                name: standalone_control_role
                tasks_from: start_database
              vars:
                standalone_control_role_environment: {SC_RC: "4"}
          rescue:
            - name: Note the failed start (exit 4)
              ansible.builtin.set_fact:
                sc_db_failed_4: "{{ ansible_failed_task.name }}"

        - name: Start the database with exit code 1
          block:
            - name: Start the database (exit 1)
              ansible.builtin.include_role:
                name: standalone_control_role
                tasks_from: start_database
              vars:
                standalone_control_role_environment: {SC_RC: "1"}
          rescue:
            - name: Note the failed start (exit 1)
              ansible.builtin.set_fact:
                sc_db_failed_1: "{{ ansible_failed_task.name }}"

        - name: Check exit 4 fails the report task and exit 1 the command (case 1)
          ansible.builtin.assert:
            that:
              - sc_db_failed_4 | default('') is search('Print start_database_script status')
              - sc_db_failed_1 | default('') is search('Start oracle database')
            fail_msg: "exit 4 failed at '{{ sc_db_failed_4 | default('nothing') }}', exit 1 at '{{ sc_db_failed_1 | default('nothing') }}'"

        # --- 2. start_listener.yml ----------------------------------------------------------------------------
        - name: Start the listener (exit 0)
          ansible.builtin.include_role:
            name: standalone_control_role
            tasks_from: start_listener

        - name: Read the listener arguments and the log (case 2)
          ansible.builtin.slurp:
            src: "{{ item }}"
          loop:
            - "{{ remote_script_directory }}/listener_ctl.bash.args"
            - "{{ remote_output_directory }}/log.{{ standalone_control_role_start_listener_script }}.{{ sc_today }}"
          register: sc_listener_files

        - name: Check the listener arguments, the output and the log (case 2)
          ansible.builtin.assert:
            that:
              - (sc_listener_files.results[0].content | b64decode).splitlines() == ['start', 'orcl', 'LISTENER_ORCL']
              - standalone_control_role_listener_start_status.rc == 0
              - "'stub listener_ctl.bash ran' in standalone_control_role_listener_start_status.stdout"
              - "'stub stderr line' in standalone_control_role_listener_start_status.stdout"
              - "'stub listener_ctl.bash ran' in (sc_listener_files.results[1].content | b64decode)"
              - "'stub stderr line' in (sc_listener_files.results[1].content | b64decode)"

        - name: Start a listener whose name holds shell metacharacters
          # noqa reason - not variables of this role: inventory sid_server_dict / original input names (test inputs).
          ansible.builtin.include_role:  # noqa: var-naming[no-role-prefix]
            name: standalone_control_role
            tasks_from: start_listener
          vars:
            sid_server_dict:
              orcl:
                dbowner: "{{ sc_user.stdout }}"
                pdb: ""
                dbvip: ""
                dbListener: "L1;touch {{ sc_tmp.path }}/pwned;$(touch {{ sc_tmp.path }}/pwned2)"
                pdbListener: ""

        - name: Read the listener arguments (metacharacters)
          ansible.builtin.slurp:
            src: "{{ remote_script_directory }}/listener_ctl.bash.args"
          register: sc_listener_meta

        - name: Look for files a shell would have created (case 2)
          ansible.builtin.stat:
            path: "{{ sc_tmp.path }}/{{ item }}"
          loop: [pwned, pwned2]
          register: sc_pwned

        - name: Check the listener name was passed literally and ran nothing (case 2)
          ansible.builtin.assert:
            that:
              # Split on whitespace like the original shell's word splitting, but every word stays literal.
              - (sc_listener_meta.content | b64decode).splitlines()
                == ['start', 'orcl', 'L1;touch', sc_tmp.path ~ '/pwned;$(touch', sc_tmp.path ~ '/pwned2)']
              - sc_pwned.results | selectattr('stat.exists') | list | length == 0

        - name: Start the listener with exit code 1
          block:
            - name: Start the listener (exit 1)
              ansible.builtin.include_role:
                name: standalone_control_role
                tasks_from: start_listener
              vars:
                standalone_control_role_environment: {SC_RC: "1"}
          rescue:
            - name: Note the failed listener start (exit 1)
              ansible.builtin.set_fact:
                sc_listener_failed_1: "{{ ansible_failed_result.rc | default('none') }}"

        - name: Check the listener script's own exit code fails the task (case 2)
          ansible.builtin.assert:
            that: sc_listener_failed_1 | default('') | string == '1'
            fail_msg: "exit 1 gave {{ sc_listener_failed_1 | default('no failure') }}"

        # --- 3. copy_scripts.yml, rename_logs.yml and start_pdb_listener.yml (real scripts) -----------------------
        # The real database control script replaces the stub name for the copy (include parameters win over the fact).
        - name: Copy the control scripts
          # noqa reason - not variables of this role: inventory sid_server_dict / original input names (test inputs).
          ansible.builtin.include_role:  # noqa: var-naming[no-role-prefix]
            name: standalone_control_role
            tasks_from: copy_scripts
          vars:
            start_database_script: database_ctl.bash

        - name: Read the copied control scripts (case 3)
          ansible.builtin.stat:
            path: "{{ remote_script_directory }}/{{ item }}"
          loop: [rename_logs.bash, database_ctl.bash, check_alert_log.bash, listener_ctl.bash, check_listener_logs.bash]
          register: sc_copied

        - name: Check every control script was copied with the script mode (case 3)
          ansible.builtin.assert:
            that:
              - sc_copied.results | rejectattr('stat.exists') | list | length == 0
              - sc_copied.results | map(attribute='stat.mode') | unique | list == ['0750']
            fail_msg: "{{ sc_copied.results | map(attribute='stat') | map(attribute='path', default='missing') | list }}"

        - name: Rename the logs (real script, missing environment file; WARNING by default)
          block:
            - name: Run rename_logs.yml
              ansible.builtin.include_role:
                name: standalone_control_role
                tasks_from: rename_logs
          rescue:
            - name: Note the reported rename_logs failure
              ansible.builtin.set_fact:
                sc_rename_failed: "{{ ansible_failed_task.name }}"

        - name: Keep the rename_logs result of the default run
          ansible.builtin.set_fact:
            sc_rename_default: "{{ standalone_control_role_rename_logs_status }}"

        - name: Rename the logs with standalone_control_role_fail_on_rename_logs_error (must fail)
          block:
            - name: Run rename_logs.yml (toggle on)
              ansible.builtin.include_role:
                name: standalone_control_role
                tasks_from: rename_logs
              vars:
                standalone_control_role_fail_on_rename_logs_error: true
          rescue:
            - name: Note the rename_logs failure (toggle on)
              ansible.builtin.set_fact:
                sc_rename_failed_toggle: "{{ ansible_failed_task.name }}"

        - name: Start the PDB listener (real script, missing environment file)
          block:
            - name: Run start_pdb_listener.yml
              # noqa reason - not variables of this role: inventory sid_server_dict / original input names (test inputs).
              ansible.builtin.include_role:  # noqa: var-naming[no-role-prefix]
                name: standalone_control_role
                tasks_from: start_pdb_listener
              vars:
                sid_server_dict:
                  orcl: {dbowner: "{{ sc_user.stdout }}", pdb: PDB1, dbvip: "", dbListener: LISTENER_ORCL, pdbListener: LISTENER_PDB1}
          rescue:
            - name: Note the reported PDB listener failure
              ansible.builtin.set_fact:
                sc_pdb_listener_failed: "{{ ansible_failed_task.name }}"

        - name: Read the rename and PDB listener logs (case 3)
          ansible.builtin.slurp:
            src: "{{ remote_output_directory }}/{{ item }}.{{ sc_today }}"
          loop: ["log.{{ standalone_control_role_rename_logs_script }}", log.start_PDB_listener]
          register: sc_real_logs

        - name: Check exit 4 is accepted by the command and reported by the next tasks (case 3)
          ansible.builtin.assert:
            that:
              - sc_rename_default.rc == 4
              - sc_rename_default is not changed
              - sc_rename_failed is not defined
              - sc_rename_failed_toggle | default('') is search('Fail when the alert log was not rotated')
              - standalone_control_role_pdb_listener_start_status.rc == 4
              - sc_pdb_listener_failed | default('') is search('Print start_pdb_listener status')
              - (sc_real_logs.results[0].content | b64decode) is search('environment file')
              - (sc_real_logs.results[1].content | b64decode) is search('environment file')
              - sc_rename_default.cmd[-3:] == [remote_script_directory ~ '/' ~ standalone_control_role_rename_logs_script, 'orcl', 'LISTENER_ORCL']
              - "'' not in sc_rename_default.cmd"
            fail_msg: >-
              rename rc {{ sc_rename_default.rc | default('none') }} failed at {{ sc_rename_failed | default('nothing') }}
              (toggle: {{ sc_rename_failed_toggle | default('nothing') }});
              PDB listener rc {{ standalone_control_role_pdb_listener_start_status.rc | default('none') }} failed at
              {{ sc_pdb_listener_failed | default('nothing') }}; cmd {{ sc_rename_default.cmd | default('none') }}

        # --- 4. check_alert_log.yml and check_listener_logs.yml (real scripts) ---------------------------------
        - name: Check the alert log and the listener logs (real scripts, missing environment file; WARNING by default)
          block:
            - name: Run check_alert_log.yml
              ansible.builtin.include_role:
                name: standalone_control_role
                tasks_from: check_alert_log
            - name: Run check_listener_logs.yml
              ansible.builtin.include_role:
                name: standalone_control_role
                tasks_from: check_listener_logs
          rescue:
            - name: Note the log check failure (default)
              ansible.builtin.set_fact:
                sc_log_check_failed: "{{ ansible_failed_task.name }}"

        - name: Keep the log check results of the default run
          ansible.builtin.set_fact:
            sc_alert_default: "{{ standalone_control_role_alert_log_status }}"
            sc_listener_logs_default: "{{ standalone_control_role_listener_logs_status }}"

        - name: Check the alert log with standalone_control_role_fail_on_alert_log_errors (must fail)
          block:
            - name: Run check_alert_log.yml (toggle on)
              ansible.builtin.include_role:
                name: standalone_control_role
                tasks_from: check_alert_log
              vars:
                standalone_control_role_fail_on_alert_log_errors: true
          rescue:
            - name: Note the alert log check failure (toggle on)
              ansible.builtin.set_fact:
                sc_alert_failed_toggle: "{{ ansible_failed_task.name }}"

        - name: Check the listener logs with standalone_control_role_fail_on_listener_log_errors (must fail)
          block:
            - name: Run check_listener_logs.yml (toggle on)
              ansible.builtin.include_role:
                name: standalone_control_role
                tasks_from: check_listener_logs
              vars:
                standalone_control_role_fail_on_listener_log_errors: true
          rescue:
            - name: Note the listener log check failure (toggle on)
              ansible.builtin.set_fact:
                sc_listener_logs_failed_toggle: "{{ ansible_failed_task.name }}"

        - name: Look for the alert log check log (case 4)
          ansible.builtin.stat:
            path: "{{ remote_output_directory }}/log.check_alert_log.bash.{{ sc_today }}"
          register: sc_alert_log_file

        - name: Check the log checks warn by default and fail with the toggles (case 4)
          ansible.builtin.assert:
            that:
              - sc_log_check_failed is not defined
              - sc_alert_default.rc != 0
              - sc_listener_logs_default.rc == 4
              - sc_alert_failed_toggle | default('') is search('Checking alert log for errors')
              - sc_listener_logs_failed_toggle | default('') is search('Fail on listener log errors')
              - sc_alert_log_file.stat.exists
            fail_msg: >-
              default run failed at {{ sc_log_check_failed | default('nothing') }} (alert rc {{ sc_alert_default.rc | default('none') }},
              listener rc {{ sc_listener_logs_default.rc | default('none') }}); toggles failed at
              {{ sc_alert_failed_toggle | default('nothing') }} / {{ sc_listener_logs_failed_toggle | default('nothing') }};
              alert log check log exists: {{ sc_alert_log_file.stat.exists | default('unknown') }}
        # --- 5. tasks/main.yml --------------------------------------------------------------------------------
        - name: Check an empty or missing dbvip skips the VIP check (case 5)
          ansible.builtin.include_tasks: tasks/vip_case.yml
          vars:
            sid_server_dict: {orcl: "{{ item.entry }}"}
            vip_entry: "{{ item.entry }}"
            vip_expected: "{{ item.expected }}"
          loop:
            - {entry: {dbvip: ""}, expected: ""}
            - {entry: {dbvip: "  "}, expected: ""}
            - {entry: {dbvip: null}, expected: ""}
            - {entry: {}, expected: ""}
            - {entry: {dbvip: dbhost01-vip.example.com}, expected: dbhost01-vip.example.com}

        - name: Check copy_scripts.yml copies every script either action runs (case 5)
          vars:
            copy_text: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../roles/standalone_control_role/tasks/copy_scripts.yml') }}"
          ansible.builtin.assert:
            that: "('{' ~ '{ ' ~ item ~ ' }' ~ '}') in copy_text"
            fail_msg: "copy_scripts.yml does not copy {{ item }}"
            quiet: true
          loop:
            - standalone_control_role_rename_logs_script
            - standalone_control_role_start_database_script
            - standalone_control_role_check_alert_log_script
            - standalone_control_role_start_listener_script
            - standalone_control_role_check_listener_logs_script
            - standalone_control_role_stop_pdb_listener_script
            - standalone_control_role_stop_listener_script
            - standalone_control_role_stop_database_script

        - name: Check the structure of tasks/main.yml (case 5)
          vars:
            main_tasks: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../roles/standalone_control_role/tasks/main.yml') | from_yaml }}"
            common: "{{ main_tasks | selectattr('name', 'equalto', 'Standalone Database Control') | first }}"
            vip_block: "{{ common.block | selectattr('name', 'search', 'Check the database VIP') | first }}"
            startup: "{{ (main_tasks | selectattr('name', 'equalto', 'Startup Database') | first).block | map('to_json') | list }}"
            shutdown: "{{ (main_tasks | selectattr('name', 'equalto', 'Shutdown Database') | first).block | map('to_json') | list }}"
            start_at: "{{ startup | select('search', 'start_database.yml') | first }}"
            stop_at: "{{ shutdown | select('search', 'stop_database.yml') | first }}"
          ansible.builtin.assert:
            that:
              - vip_block.when is search('__standalone_control_role_vip \\| length > 0')
              - (common.block | last | to_json) is search('copy_scripts.yml')
              - startup.index(startup | select('search', "'starting'") | first) < startup.index(start_at)
              - startup.index(startup | select('search', "'started'") | first) == startup.index(start_at) + 1
              - shutdown.index(shutdown | select('search', "'stopping'") | first) == shutdown.index(stop_at) - 1
              - shutdown.index(shutdown | select('search', "'stopped'") | first) == shutdown.index(stop_at) + 1
            fail_msg: "standalone_control_role tasks/main.yml: VIP skip, script copy or progress records are not wired as expected"

      always:
        - name: Remove the temporary directory
          ansible.builtin.file:
            path: "{{ sc_tmp.path }}"
            state: absent
          when: sc_tmp.path is defined
