---
# Error handling regression test (U4): the failure report of roles/oracle_common (tasks/failure_record.yml,
# tasks/failure_report.yml, tasks/progress.yml) and the error handling rules of the playbooks and roles. Runs on the
# controller only; nothing is sent anywhere (no webhook URL is configured, so the notification is skipped with a
# message). Run from the repository root:
#   ansible-playbook -i localhost, -c local tests/failure_report.yml
#
# 1. tasks/progress.yml merges the progress recursively.
# 2. tasks/failure_report.yml end to end (tests/tasks/failure_report_case.yml): the host fails with the stage, the failed
#    task, its error, exit code and last output lines, and the state left behind - databases stopped by the run (or whose
#    shutdown or startup failed), whether the Oracle home was patched (unknown after a failed patch step), datapatch per
#    database, files removed or kept; a failure recorded before a cleanup is not replaced by the cleanup's own error; the
#    notification is attempted with the requested state.
# 3. Structure: every rescue of both playbooks ends with the failure report (no bare "Fail"), a rescue that cleans up
#    records the failure first, no ignore_errors in the playbooks or roles, every command task has changed_when.
- name: Error handling regression test
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    DATABASE_NAME: ORCL01  # noqa: var-naming[pattern] - original input name, kept for compatibility
    repo: "{{ playbook_dir }}/.."
    run_two:
      scope: [ORCL01, ORCL02]
      script_dir: /u01/oracle/ansible_patch_work/ora_ansible_scripts_ORCL01_r1
      databases:
        ORCL01: {work_dir: /u01/oracle/ansible_patch_work/ora_db_patch_ORCL01_r1}
        ORCL02: {work_dir: /u01/oracle/ansible_patch_work/ora_db_patch_ORCL01_r1/ORCL02}
    patch_folder_name: /u01/oracle/software_dir/19.0/jan26_ORCL01_r1
    failure_cases:
      - name: validation failure before anything ran
        stage: Validate the job inputs
        expect:
          - "State left behind: databases: ORCL01 not stopped by this run"
          - "Oracle home: not changed by this run"
          - "files: none created on the host by this run"
        reject: [datapatch, "next step"]
      - name: shutdown of the second database failed
        stage: Shutdown
        progress: {databases: {ORCL01: stopped, ORCL02: stopping}}
        run: "{{ run_two }}"
        cleanup: true
        record_first: true
        expect:
          - "databases: ORCL01 DOWN (stopped by this run), ORCL02 shutdown failed or not verified"
          - "Oracle home: not changed by this run"
          - "files: the script and staging directories this run created were removed"
          - "the logs are kept in /u01/oracle/ansible_patch_work/ora_db_patch_ORCL01_r1"
          - "next step: a DBA must check and start the databases left down"
        reject: [datapatch]
      - name: datapatch of the second database failed
        stage: Patch
        progress: {databases: {ORCL01: stopped, ORCL02: stopped}, home: patched, datapatch: {ORCL01: done, ORCL02: running}}
        run: "{{ run_two }}"
        expect:
          - "databases: ORCL01 DOWN (stopped by this run), ORCL02 DOWN (stopped by this run)"
          - "Oracle home: patched by this run"
          - "datapatch: ORCL01 done, ORCL02 FAILED or unfinished"
          - "files: kept for diagnosis - scripts /u01/oracle/ansible_patch_work/ora_ansible_scripts_ORCL01_r1"
          - "staging /u01/oracle/software_dir/19.0/jan26_ORCL01_r1"
          - "next step:"
        reject: [removed]
      - name: single-database apply failed part-way
        stage: Patch
        progress: {databases: {ORCL01: stopped}, home: patching, datapatch: {ORCL01: running}}
        run: {scope: [ORCL01], script_dir: /s, databases: {ORCL01: {work_dir: /w}}}
        expect:
          - "Oracle home: UNKNOWN - the patch step failed or did not finish part-way"
          - "datapatch: ORCL01 FAILED or unfinished"
        reject: ["not changed by this run"]
      - name: startup failed after a successful patch
        stage: Startup
        progress: {databases: {ORCL01: started, ORCL02: starting}, home: patched, datapatch: {ORCL01: done, ORCL02: done}}
        run: "{{ run_two }}"
        cleanup: true
        record_first: true
        expect:
          - "databases: ORCL01 started by this run, ORCL02 startup failed (probably DOWN)"
          - "datapatch: ORCL01 done, ORCL02 done"
          - "next step:"
      - name: already applied with oracle_common_fail_when_already_applied (unneeded card)
        stage: Run Prereq
        call: unneeded
        run: "{{ run_two }}"
        cleanup: true
        record_first: true
        expect:
          - "databases: ORCL01 not stopped by this run, ORCL02 not stopped by this run"
          - "Oracle home: not changed by this run"
        reject: ["next step", datapatch]
    playbooks:
      - oracle_database_patch.yml
      - oracle_database_patch_prereq.yml
  tasks:
    # --- 1. progress.yml ---------------------------------------------------------------------------------------------
    - name: Reset the progress
      ansible.builtin.set_fact:
        oracle_common_progress: {}

    - name: Record progress twice
      ansible.builtin.include_tasks: tasks/oracle_common.yml
      vars:
        test_tasks_from: progress
        oracle_common_progress_update: "{{ item }}"
      loop:
        - {databases: {ORCL01: stopping}}
        - {databases: {ORCL02: stopping}, home: patching}
        - {databases: {ORCL01: stopped}, datapatch: {ORCL01: running}}

    - name: Check the progress was merged recursively
      ansible.builtin.assert:
        that: >-
          oracle_common_progress == {'databases': {'ORCL01': 'stopped', 'ORCL02': 'stopping'}, 'home': 'patching',
                                     'datapatch': {'ORCL01': 'running'}}
        fail_msg: "unexpected progress: {{ oracle_common_progress }}"

    # --- 2. failure_report.yml end to end --------------------------------------------------------------------------
    - name: Run the failure report cases
      ansible.builtin.include_tasks: tasks/failure_report_case.yml
      loop: "{{ failure_cases }}"
      loop_control:
        loop_var: failure_case
        label: "{{ failure_case.name }}"

    # --- 3. Structure ------------------------------------------------------------------------------------------------
    - name: Find the task files of the roles
      ansible.builtin.find:
        paths: "{{ repo }}/roles"
        patterns: "*.yml"
        recurse: true
      register: fr_role_files

    # Every YAML task file of the playbooks and roles (the static rules below).
    - name: List the playbooks and task files
      ansible.builtin.set_fact:
        task_files: >-
          {{ ['oracle_database_patch.yml', 'oracle_database_patch_prereq.yml', 'notification.yml', 'oracle_chg_ticket.yml',
              'oracle_control_sid.yml']
             + (fr_role_files.files | map(attribute='path') | select('search', '/roles/[^/]+/tasks/[^/]+[.]yml\Z')
                | map('regex_replace', '\A.*/(roles/[^/]+/tasks/[^/]+[.]yml)\Z', '\1') | sort | list) }}

    - name: Check the task file list is complete
      ansible.builtin.assert:
        that:
          - task_files | length > 40
          - "'roles/standalone_control_role/tasks/check_listener_logs.yml' in task_files"
          - "'roles/oracle_common/tasks/failure_report.yml' in task_files"
        fail_msg: "unexpected task file list: {{ task_files }}"

    - name: Check every rescue of the playbooks ends with the failure report
      vars:
        plays: "{{ lookup('ansible.builtin.file', repo ~ '/' ~ item) | from_yaml }}"
        # Every block with a rescue, at any depth (play tasks, pre_tasks and post_tasks).
        rescues: >-
          {%- set ns = namespace(todo=[], out=[]) -%}
          {%- for play in plays -%}
          {%-   set ns.todo = ns.todo + play.pre_tasks | default([]) + play.tasks | default([]) + play.post_tasks | default([]) -%}
          {%- endfor -%}
          {%- for _ in range(6) -%}
          {%-   set todo = ns.todo -%}
          {%-   set ns.todo = [] -%}
          {%-   for t in todo -%}
          {%-     if t.rescue is defined -%}{%- set ns.out = ns.out + [t] -%}{%- endif -%}
          {%-     set ns.todo = ns.todo + t.block | default([]) + t.rescue | default([]) + t.always | default([]) -%}
          {%-   endfor -%}
          {%- endfor -%}
          {{ ns.out }}
        bad: >-
          {%- set ns = namespace(out=[]) -%}
          {%- for b in rescues -%}
          {%-   set last = b.rescue | last -%}
          {%-   set text = b.rescue | to_json -%}
          {%-   set ends_with_report = (last['ansible.builtin.include_role'] | default({})).tasks_from | default('') == 'failure_report' -%}
          {%-   set records_first = (b.rescue | first | to_json) is search('failure_record') -%}
          {%-   if not ends_with_report
                   or ('clean_files_from_server' in text and not records_first)
                   or 'ansible.builtin.fail' in text -%}
          {%-     set ns.out = ns.out + [b.name] -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ ns.out }}
      ansible.builtin.assert:
        that:
          - rescues | length >= 6
          - bad | length == 0
        fail_msg: "{{ item }}: these rescues do not end with the failure report (or clean up before recording it): {{ bad }}"
        success_msg: "{{ item }}: all {{ rescues | length }} rescues end with the failure report"
      loop: "{{ playbooks }}"

    - name: Check no task hides a failure with ignore_errors
      vars:
        text: "{{ lookup('ansible.builtin.file', repo ~ '/' ~ item) }}"
      ansible.builtin.assert:
        that: text is not search('(?m)^\s*ignore_errors:')
        fail_msg: "{{ item }} uses ignore_errors: use failed_when with explicit conditions, or block/rescue"
        quiet: true
      loop: "{{ task_files }}"

    - name: Check every command task states when it changes something
      vars:
        file_tasks: "{{ lookup('ansible.builtin.file', repo ~ '/' ~ item) | from_yaml }}"
        # Task lists of a task file or of the plays of a playbook, flattened through blocks.
        flat: >-
          {%- set ns = namespace(todo=[], out=[]) -%}
          {%- for t in file_tasks -%}
          {%-   if t.hosts is defined -%}
          {%-     set ns.todo = ns.todo + t.pre_tasks | default([]) + t.tasks | default([]) + t.post_tasks | default([]) -%}
          {%-   else -%}
          {%-     set ns.todo = ns.todo + [t] -%}
          {%-   endif -%}
          {%- endfor -%}
          {%- for _ in range(6) -%}
          {%-   set todo = ns.todo -%}
          {%-   set ns.todo = [] -%}
          {%-   for t in todo -%}
          {%-     set ns.out = ns.out + [t] -%}
          {%-     set ns.todo = ns.todo + t.block | default([]) + t.rescue | default([]) + t.always | default([]) -%}
          {%-   endfor -%}
          {%- endfor -%}
          {{ ns.out }}
        missing: >-
          {{ flat | select('contains', 'ansible.builtin.command') | rejectattr('changed_when', 'defined')
             | map(attribute='name') | list
             + (flat | select('contains', 'ansible.builtin.shell') | map(attribute='name') | list)
             + (flat | select('contains', 'command') | map(attribute='name') | list)
             + (flat | select('contains', 'shell') | map(attribute='name') | list) }}
      ansible.builtin.assert:
        that: missing | length == 0
        fail_msg: "{{ item }}: command tasks without changed_when (or non-FQCN / shell tasks): {{ missing }}"
        quiet: true
      loop: "{{ task_files }}"
