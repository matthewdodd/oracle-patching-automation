---
# Change record state regression test (roles/oracle_common tasks/change_ticket_state.yml). Feeds results shaped like
# servicenow.itsm.change_request_info's (records with state names, or numeric states) to the real task file; no
# network. Run from the repository root:
#   ansible-playbook -i localhost, -c local tests/change_ticket_state.yml
#
# Default allowed range -2 .. -1 (Scheduled .. Implement, the original check): scheduled, implement and the numeric
# "-2" / "-1" pass; new, authorize, review, closed, "0", an unknown name and an empty state fail with "is not in the
# required state"; no record and two records fail with a clear message; a custom range and a custom state name
# are honoured. Each case is one block (reset the outcome to a sentinel, run the real task file, record the
# outcome) followed by its check, so a case can never pass on the result of the previous one.
- name: Change record state regression test
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    test_tasks_from: change_ticket_state
    TICKET_NUMBER: CHG0030001  # noqa: var-naming[pattern] - original input name
  tasks:
    - name: Case scheduled passes
      block:
        - name: Reset the outcome (scheduled passes)
          ansible.builtin.set_fact: {test_outcome: __not_run__, __oracle_common_chg_state: __not_run__}
        - name: Check the change record state (scheduled passes)
          ansible.builtin.include_tasks: tasks/oracle_common.yml
          vars:
            __oracle_common_chg_result: {records: [{"number": "CHG0030001", "state": "scheduled"}]}
        - name: Record the outcome (scheduled passes)
          ansible.builtin.set_fact: {test_outcome: passed}
      rescue:
        - name: Record the failure (scheduled passes)
          ansible.builtin.set_fact: {test_outcome: "{{ ansible_failed_result.msg | default('failed') }}"}
    - name: Check case scheduled passes
      ansible.builtin.assert:
        that:
          - __oracle_common_chg_state != '__not_run__'
          - "test_outcome == 'passed'"
        fail_msg: "case 'scheduled passes': expected 'passed', got: {{ test_outcome }}"
        quiet: true

    - name: Case implement passes
      block:
        - name: Reset the outcome (implement passes)
          ansible.builtin.set_fact: {test_outcome: __not_run__, __oracle_common_chg_state: __not_run__}
        - name: Check the change record state (implement passes)
          ansible.builtin.include_tasks: tasks/oracle_common.yml
          vars:
            __oracle_common_chg_result: {records: [{"number": "CHG0030001", "state": "implement"}]}
        - name: Record the outcome (implement passes)
          ansible.builtin.set_fact: {test_outcome: passed}
      rescue:
        - name: Record the failure (implement passes)
          ansible.builtin.set_fact: {test_outcome: "{{ ansible_failed_result.msg | default('failed') }}"}
    - name: Check case implement passes
      ansible.builtin.assert:
        that:
          - __oracle_common_chg_state != '__not_run__'
          - "test_outcome == 'passed'"
        fail_msg: "case 'implement passes': expected 'passed', got: {{ test_outcome }}"
        quiet: true

    - name: Case numeric -2 passes
