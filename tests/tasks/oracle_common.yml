---
# Runs one task file of roles/oracle_common (test_tasks_from) for the test playbooks; every test goes through this
# file. The role is referenced by path because the tests live in tests/ and ansible.cfg sets no roles_path; the
# task file is still one of the role's own (tasks_from inside the role).
- name: Run a task file of roles/oracle_common, {{ test_tasks_from }}  # noqa: role-name[path] - repository role referenced by path from tests/
  ansible.builtin.include_role:
    name: "{{ playbook_dir }}/../roles/oracle_common"
    tasks_from: "{{ test_tasks_from }}"
