---
# Loaded by tests/tasks/platform_case.yml before each platform case, at the same precedence as the role's
# include_vars, so tasks/os_vars.yml can still override it. The sentinels are not real values: an accepted case
# that loaded no OS file (or kept the values of the previous case) cannot match its expected file.
__oracle_common_prereq_packages: [__platform_case_not_loaded__]
__oracle_common_artifact_platform: __platform_case_not_loaded__
__oracle_common_package_manager: __platform_case_not_loaded__
