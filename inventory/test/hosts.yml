---
# test environment inventory (skeleton). See inventory/README.md.
#
# Replace the "<CHANGE_ME>" host with the test database servers. The placeholder is not a valid host name: the job
# input validation rejects it as a target (and it cannot be reached), so an unedited skeleton patches nothing.
#
# Run with this inventory and the test vault id:
#   ansible-playbook -i inventory/test/hosts.yml --vault-id test@prompt oracle_database_patch.yml \
#     -e target=<host> -e DATABASE_NAME=<SID> -e TICKET_NUMBER=<change number>
#
# Hosts given only in -e target=... (not listed here) are added at run time; they still get group_vars/all/ (every
# host is in the group "all"). -e ansible_inventory_groups=oracle_db_servers also puts them in the group below.
all:
  children:
    oracle_db_servers:
      hosts:
        "<CHANGE_ME>":
        # e.g.
        # dbhost01.test.<your domain>:
        # dbhost02.test.<your domain>:
