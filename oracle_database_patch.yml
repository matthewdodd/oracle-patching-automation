---
- name: Add server names passed in to the Playbook
  hosts: all,localhost
  gather_facts: false
  run_once: true
  tasks:
    - name: Check that target was supplied
      ansible.builtin.assert:
        that:
          - target is defined
          - target | string | trim | length > 0
        fail_msg: >-
          target is required: pass the comma or space separated host list, e.g. -e target=dbhost01.example.com
          (AAP: the 'target' survey question / extra var).
        quiet: true
      any_errors_fatal: true

    - name: Add server names to the Ansible inventory
      when: target is defined
      ansible.builtin.add_host:
        name: '{{ item }}'
        groups: '{{ ansible_inventory_groups | default(omit) }}'
      loop: "{{ target.replace(',', '\n').split() }}"
      changed_when: false

- name: Full Database Patching Playbook - Pre-Tasks
  hosts: localhost
  gather_facts: false
  pre_tasks:
    # Validate the job inputs (target, DATABASE_NAME, TICKET_NUMBER, override_chg, sid_server_dict entries) and the patch
    # scope (oracle_patch_databases) before anything else runs: anchored patterns, "<CHANGE_ME>" placeholders rejected
    # (roles/oracle_common).
    - name: Validate the job inputs
      block:
        - name: Validate the job inputs
          ansible.builtin.import_role:
            name: oracle_common
            tasks_from: validate_job
        - name: Validate the patch scope and the safety settings
          ansible.builtin.import_role:
            name: oracle_common
            tasks_from: preflight_scope
      rescue:
        - name: Send the failure notification
          ansible.builtin.include_tasks: notification.yml
          vars:
            call: "fail"
            summary_state: "patching"
        - name: Fail on invalid job inputs
          ansible.builtin.fail:
            msg: "Fail: {{ ansible_failed_result.msg | default('invalid job inputs') }}"

    - name: Send Starting Notification
      ansible.builtin.include_tasks: notification.yml
      vars:
        call: "start"
        summary_state: "patching"

    - name: Validate Inventory
      block:
        - name: Validate that the Database is in the Inventory Dictionary
          ansible.builtin.debug:
            msg: "{{ item }}"
          loop:
            - "{{ sid_server_dict[DATABASE_NAME] }}"
      rescue:
        - name: Send Notification
          ansible.builtin.include_tasks: notification.yml
          vars:
            call: "fail"
            summary_state: "patching"
        - name: Check if Fail
          ansible.builtin.fail:
            msg: "Fail"

    # oracle_chg_ticket.yml decides itself: it skips the check when override_chg (or oracle_common_override_chg) is true,
    # a boolean or the legacy strings "true" / "false". The original included it only when override_chg was the string
    # "false", so a boolean false skipped the check and an undefined override_chg failed the run.
    - name: Validate Change Ticket
      block:
        - name: Change Ticket Validation
          ansible.builtin.include_tasks: oracle_chg_ticket.yml
      rescue:
        - name: Checking Change Ticket Validation
          ansible.builtin.include_tasks: notification.yml
          vars:
            call: "fail"
            summary_state: "patching"
        - name: Check if Fail
          ansible.builtin.fail:
            msg: "Fail"

- name: Full Database Patching Playbook - Tasks
  # The default only keeps the play parseable when target is missing; play 1 fails first with a clear message.
  hosts: "{{ target | default('') }}"
  # Facts are gathered by oracle_common after a Python-free check of the OS release: gathering them here would
  # fail on EL7 / Amazon Linux 2 (no Python 3.9+ for ansible-core 2.22) before the guard could name the release.
  gather_facts: false
  tasks:
    # First, before anything changes on the host: refuse unsupported platforms (EL7, Amazon Linux 2), gather facts,
    # load the per-OS variables and the supported Oracle versions, and validate every input (roles/oracle_common).
    - name: Load the common configuration and validate the inputs
      block:
        - name: Load the common configuration and validate the inputs
          ansible.builtin.import_role:
            name: oracle_common
      rescue:
        - name: Report the common configuration failure
          delegate_to: 127.0.0.1
          block:
            - name: Send the failure notification
              ansible.builtin.include_tasks: notification.yml
              vars:
                call: "fail"
                summary_state: "patching"
            - name: Fail on an unsupported platform or invalid inputs
              ansible.builtin.fail:
                msg: "Fail"

    # Validates the scope on this host, chooses this run's working directories, checks the owner of every running
    # database in scope, stages the scripts and resolves the patch bundle.
    - name: Initialize
      block:
        - name: Initialize
          ansible.builtin.import_role:
            name: initialization_role
      rescue:
        - name: Remove this run's patching files
          ansible.builtin.include_role:
            name: oracle_database_patch_role
            tasks_from: clean_files_from_server
        - name: Report the initialization failure
          delegate_to: 127.0.0.1
          block:
            - name: Checking Initialize Playbook
              ansible.builtin.include_tasks: notification.yml
              vars:
                call: "fail"
                summary_state: "patching"
            - name: Check if Fail
              ansible.builtin.fail:
                msg: "Fail: {{ ansible_failed_result.msg | default('initialization failed') }}"

    # Before anything is stopped or the home is changed: refuse unless every database that uses the ORACLE_HOME is in
    # scope (oracle_patch_databases), and every database in scope uses that home.
    - name: Check the databases that use the Oracle home
      block:
        - name: Check the databases that use the Oracle home
          ansible.builtin.import_role:
            name: oracle_common
            tasks_from: shared_home
      rescue:
        - name: Remove this run's patching files
          ansible.builtin.include_role:
            name: oracle_database_patch_role
            tasks_from: clean_files_from_server
        - name: Report the shared Oracle home refusal
          delegate_to: 127.0.0.1
          block:
            - name: Notify for failure
              ansible.builtin.include_tasks: notification.yml
              vars:
                call: "fail"
                summary_state: "patching"
            - name: Refuse to patch the Oracle home
              ansible.builtin.fail:
                msg: "Fail: {{ ansible_failed_result.msg | default('shared Oracle home check failed') }}"

    - name: Run Prereq
      block:
        - name: Run Prereq
          ansible.builtin.import_role:
            name: oracle_database_patch_role
            tasks_from: run_prereq
      rescue:
        # "unneeded" only when the patch is already applied in every database in scope (with
        # oracle_common_fail_when_already_applied); any other failure, including a failed status check, is "fail".
        - name: Choose the notification
          ansible.builtin.set_fact:
            notification_call: >-
              {{ 'unneeded' if ((oracle_common_patch_status | default({})).outcome | default('')) == 'applied' else 'fail' }}
        - name: Remove old patching files
          ansible.builtin.include_role:
            name: oracle_database_patch_role
            tasks_from: clean_files_from_server
        - name: Report the prerequisite outcome
          delegate_to: 127.0.0.1
          block:
            - name: Checking Run Prereq
              ansible.builtin.include_tasks: notification.yml
              vars:
                call: "{{ notification_call }}"
                summary_state: "patching"
            - name: Check if Fail
              ansible.builtin.fail:
                msg: "Fail: {{ ansible_failed_result.msg | default('prerequisite checks failed') }}"

    # Already applied in every database in scope: nothing is stopped or changed. The run ends successfully for this host
    # with the "unneeded" notification (oracle_common_fail_when_already_applied: true fails instead, in the rescue above).
    - name: Skip a patch that is already applied
      when: ((oracle_common_patch_status | default({})).outcome | default('')) == 'applied'
      block:
        - name: Remove old patching files
          ansible.builtin.include_role:
            name: oracle_database_patch_role
            tasks_from: clean_files_from_server
        - name: Report the unneeded patch
          delegate_to: 127.0.0.1
          block:
            - name: Send the unneeded notification
              ansible.builtin.include_tasks: notification.yml
              vars:
                call: "unneeded"
                summary_state: "patching"
        - name: End the run for this host (the patch is already applied)
          ansible.builtin.meta: end_host
          when: ((oracle_common_patch_status | default({})).outcome | default('')) == 'applied'

    - name: Shutdown the Oracle Database
      block:
        - name: Shutdown the Oracle Database
          ansible.builtin.include_tasks: oracle_control_sid.yml
          vars:
            control: "shutdown"
      rescue:
        - name: Cleanup Shutdown if Fail
          ansible.builtin.include_role:
            name: oracle_database_patch_role
            tasks_from: clean_files_from_server
        - name: Report the shutdown failure
          delegate_to: 127.0.0.1
          block:
            - name: Notify for failure
              ansible.builtin.include_tasks: notification.yml
              vars:
                call: "fail"
                summary_state: "patching"
            - name: Check if Fail
              ansible.builtin.fail:
                msg: "Fail: {{ ansible_failed_result.msg | default('shutdown failed') }}"

    # No cleanup and no restart on a failed patch step: the databases stay down and the staged patch is kept for
    # diagnosis, as before.
    - name: Patch the Oracle Database
      block:
        - name: Patch the Oracle Database
          ansible.builtin.import_role:
            name: oracle_database_patch_role
      rescue:
        - name: Report the patch failure
          delegate_to: 127.0.0.1
          block:
            - name: Notify for failure
              ansible.builtin.include_tasks: notification.yml
              vars:
                call: "fail"
                summary_state: "patching"
            - name: Check if Fail
              ansible.builtin.fail:
                msg: "Fail: {{ ansible_failed_result.msg | default('patch failed') }}"

    - name: Startup the Oracle Database
      block:
        - name: Startup the Oracle Database
          ansible.builtin.include_tasks: oracle_control_sid.yml
          vars:
            control: "startup"
      rescue:
        - name: Cleanup Startup if Fail
          ansible.builtin.include_role:
            name: oracle_database_patch_role
            tasks_from: clean_files_from_server
        - name: Report the startup failure
          delegate_to: 127.0.0.1
          block:
            - name: Notify for failure
              ansible.builtin.include_tasks: notification.yml
              vars:
                call: "fail"
                summary_state: "patching"
            - name: Check if Fail
              ansible.builtin.fail:
                msg: "Fail: {{ ansible_failed_result.msg | default('startup failed') }}"

  post_tasks:
    # Removes only what this run created; a path that cannot be removed is reported as a WARNING (never hidden).
    - name: Remove old patching files
      ansible.builtin.import_role:
        name: oracle_database_patch_role
        tasks_from: clean_files_from_server

    - name: Report the successful run
      delegate_to: 127.0.0.1
      block:
        - name: Send Success Notification
          ansible.builtin.include_tasks: notification.yml
          vars:
            call: "success"
            summary_state: "patching"
