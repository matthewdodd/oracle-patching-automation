---
# Teams notification (Teams Workflows webhook, Adaptive Card). Same interface as before:
#   - ansible.builtin.include_tasks: notification.yml
#     vars:
#       call: start | success | unneeded | fail                (summary_state: patching)
#             start_prereq | success_prereq | failure          (summary_state: prereq)
#       summary_state: patching | prereq
# The card is built and sent by roles/oracle_common (tasks/notify.yml; settings in
# defaults/main/notify.yml). The webhook URL comes from the Ansible Vault (vault_teams_webhook_url). Best effort:
# nothing in this file can fail the run - a notification that cannot be sent is reported as a WARNING.
- name: Send the Teams notification (best effort)
  block:
    - name: Send the Teams notification
      ansible.builtin.include_role:
        name: oracle_common
        tasks_from: notify
  rescue:
    - name: Report the failed notification (non-fatal)
      ansible.builtin.debug:
        msg: "WARNING: Teams notification '{{ call | default('') }}' was not sent (details hidden: the request may carry a secret)"
