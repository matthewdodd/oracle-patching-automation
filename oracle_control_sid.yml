---
## startup/shutdown oracle database by sid
# Included by the playbooks with control: startup or shutdown. Runs standalone_control_role for every database in scope
# of the run (oracle_common_run.scope: DATABASE_NAME first, then the other databases of its ORACLE_HOME listed in
# oracle_common_patch_databases; just DATABASE_NAME when included outside a patch run). Each database uses its own
# listeners (sid_server_dict) and logs into its own working directory. As before, the role receives the SID in lower
# case (ORACLE_SID) and runs on server_name (target).

- name: Set the control target
  ansible.builtin.set_fact:
    server_name: "{{ target }}"
    oracle_control_sid_databases: "{{ (oracle_common_run | default({})).scope | default([DATABASE_NAME]) }}"
    # Working (log) directory per database; outside a patch run, DATABASE_NAME uses remote_output_directory.
    oracle_control_sid_work_dirs: >-
      {{ {DATABASE_NAME: remote_output_directory | default('')}
         | combine(dict((oracle_common_run | default({})).databases | default({}) | dict2items | map(attribute='key')
                        | zip((oracle_common_run | default({})).databases | default({}) | dict2items | map(attribute='value.work_dir')))) }}

- name: Startup/Shutdown database playbook given SID
  when: server_name is defined
  block:
    - name: Initiating standalone_control_role for {{ oracle_control_sid_item }}
      # control_command, ORACLE_SID and remote_output_directory are the role's original input names.
      ansible.builtin.include_role:  # noqa: var-naming[no-role-prefix]
        name: standalone_control_role
      vars:
        control_command: "{{ control }}"
        ORACLE_SID: "{{ oracle_control_sid_item | lower }}"  # noqa: var-naming[pattern] - original variable name of the role
        remote_output_directory: "{{ oracle_control_sid_work_dirs[oracle_control_sid_item] }}"
      loop: "{{ oracle_control_sid_databases }}"
      loop_control:
        loop_var: oracle_control_sid_item
