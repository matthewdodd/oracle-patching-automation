---
## startup/shutdown oracle database by sid
# Included by the playbooks with control: startup or shutdown. Runs standalone_control_role for every database in scope
# of the run (oracle_common_run.scope: DATABASE_NAME first, then the other databases of its ORACLE_HOME listed in
# oracle_common_patch_databases; just DATABASE_NAME when included outside a patch run). Each database uses its own
# listeners (sid_server_dict) and logs into its own working directory. As before, the role receives the SID in lower
# case (ORACLE_SID) and runs on server_name; it also receives the SID as given (standalone_control_role_sid, for the
# sid_server_dict lookup) and, in a patch run, the environment file of the database (ORA_ENV_FILE).
# server_name is the current host (inventory_hostname). It used to be the whole target string, so with several targets
# (target=a,b) every host delegated to the non-existent host "a,b"; with one target it is the same host as before.

- name: Set the control target
  ansible.builtin.set_fact:
    server_name: "{{ inventory_hostname }}"
    oracle_control_sid_databases: "{{ (oracle_common_run | default({})).scope | default([DATABASE_NAME]) }}"
    # Working (log) directory per database; outside a patch run, DATABASE_NAME uses remote_output_directory.
    oracle_control_sid_work_dirs: >-
      {{ {DATABASE_NAME: remote_output_directory | default('')}
         | combine(dict((oracle_common_run | default({})).databases | default({}) | dict2items | map(attribute='key')
                        | zip((oracle_common_run | default({})).databases | default({}) | dict2items | map(attribute='value.work_dir')))) }}
    # Environment file per database in a patch run (oracle_common_run.databases[<SID>].env_file); none outside one.
    oracle_control_sid_env_files: >-
      {{ dict((oracle_common_run | default({})).databases | default({}) | dict2items | map(attribute='key')
              | zip((oracle_common_run | default({})).databases | default({}) | dict2items | map(attribute='value.env_file'))) }}

# Before the first database is started or stopped: every database in scope must have the sid_server_dict entry the
# control role looks up (the lower-case ORACLE_SID, else the SID as given), so a missing entry can never leave the run
# half-way with some databases already stopped.
- name: Check every database in scope has a sid_server_dict entry
  ansible.builtin.assert:
    that: __oracle_control_sid_missing | length == 0
    fail_msg: >-
      sid_server_dict has no entry for {{ __oracle_control_sid_missing | join(', ') }}: refusing the {{ control }} of
      every database of this run (none has been started or stopped by this step)
    quiet: true
  vars:
    __oracle_control_sid_missing: >-
      {%- set d = sid_server_dict if sid_server_dict is mapping else {} -%}
      {%- set ns = namespace(out=[]) -%}
      {%- for sid in oracle_control_sid_databases if sid not in d and (sid | lower) not in d -%}
      {%-   set ns.out = ns.out + [sid] -%}
      {%- endfor -%}
      {{ ns.out }}

- name: Startup/Shutdown database playbook given SID
  when: server_name is defined
  block:
    - name: Initiating standalone_control_role for {{ oracle_control_sid_item }}
      # control_command, ORACLE_SID and remote_output_directory are the role's original public input names (other
      # playbooks may pass them too), so they cannot carry the role prefix.
      ansible.builtin.include_role:  # noqa: var-naming[no-role-prefix] - original input names of the role
        name: standalone_control_role
      vars:
        control_command: "{{ control }}"
        ORACLE_SID: "{{ oracle_control_sid_item | lower }}"  # noqa: var-naming[pattern] - original variable name of the role
        remote_output_directory: "{{ oracle_control_sid_work_dirs[oracle_control_sid_item] }}"
        # The SID as given (sid_server_dict lookup when there is no lower-case entry) and, in a patch run, the
        # environment file the shared ORACLE_HOME check validated for it.
        standalone_control_role_sid: "{{ oracle_control_sid_item }}"
        standalone_control_role_environment: >-
          {{ {'ORA_ENV_FILE': oracle_control_sid_env_files[oracle_control_sid_item]}
             if (oracle_control_sid_env_files[oracle_control_sid_item] | default('') | length > 0) else {} }}
      loop: "{{ oracle_control_sid_databases }}"
      loop_control:
        loop_var: oracle_control_sid_item
