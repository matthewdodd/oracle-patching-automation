---
# ServiceNow change check. Same interface as before (included without variables from the full patching playbook;
# its rescue sends the failure card). The check runs in roles/oracle_common (tasks/change_ticket.yml; settings in
# defaults/main/servicenow.yml) with servicenow.itsm.change_request_info: credentials from the Ansible Vault
# (vault_snow_instance, vault_snow_user, vault_snow_password; snow_instance, snow_user and snow_password are still
# accepted), no_log on every task that touches them. override_chg true (boolean or "true") skips the check.
# The change record TICKET_NUMBER must be in an allowed state (default -2 Scheduled .. -1 Implement).
- name: Validate ServiceNow Change Ticket
  ansible.builtin.include_role:
    name: oracle_common
    tasks_from: change_ticket
